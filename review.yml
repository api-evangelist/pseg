findings:
  summary: >-
    PSEG is the clean negative case for the energy sector's central question. A
    regulator can point at the Green Button Standard and a utility can ship a
    Green Button file, and neither event produces an API. PSEG Long Island
    documents a Green Button (.XML) download inside a logged-in customer portal
    — Download My Data, the one-customer, one-file half of the standard — while
    the Connect My Data half that would let a third party call for a consented
    customer's interval data does not exist, by PSE&G's own account in the New
    Jersey BPU AMI docket, where the answer to an aggregator asking for
    thousands of accounts was that each customer must log in and add them
    manually. Both halves of the sector are closed here: consumer data is behind
    a login and a Letter of Authorization, and grid data is a KUBRA-hosted
    outage widget. The open data for this territory belongs to PJM and the EIA,
    not to the utility that operates the wires.
  developerPortal: none
  apisListed: 0
  openapiHarvested: false
  specsCount: 0

