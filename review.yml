aid: pseg
name: PSEG
review:
  question: >-
    Does PSEG publish a public developer portal or any documented API through
    which a third party can obtain customer energy data or open grid/market
    data?
  answer: false
  date: '2026-07-27'
  reviewer: API Evangelist
  tier: utility-retailer
  homeMarket: United States
  primaryDomain: pseg.com

energyDataPosture:
  homeMarket: United States
  serviceTerritories:
    - New Jersey (PSE&G — regulated electric and gas distribution)
    - Long Island and the Rockaways, New York (PSEG Long Island — operates the
      T&D system under contract to the Long Island Power Authority)
  wholesaleMarket: >-
    PJM Interconnection. PSEG is a market participant, not a market operator —
    the open wholesale/market data for this territory is published by PJM (Data
    Miner) and the U.S. EIA, not by PSEG. Nothing PSEG publishes was found to
    duplicate it.

  mandateRegime: green-button-voluntary
  mandateRegimeNote: >-
    There is no United States federal consumer energy data mandate. The Green
    Button / NAESB REQ.21 ESPI standard exists and is adopted voluntarily. The
    one complicating fact, recorded here so it is not lost: the New Jersey Board
    of Public Utilities' AMI proceeding for PSE&G directs meter data sharing
    referencing the Green Button Standard with non-discriminatory third-party
    access. That is a STATE regulatory direction, not a federal mandate and not
    a consumer data right of the Australian CDR or Ontario Green Button kind, so
    the honest bucket remains green-button-voluntary. A stricter reading could
    file this as `other` (state PUC AMI order); it is emphatically not
    green-button-ontario and not cdr-energy.

  mandateStatus: live-claimed-unverified
  mandateStatusNote: >-
    Separating the claim from the implementation, which is the whole point of
    this record:
      * CLAIMED AND DOCUMENTED — Green Button Download My Data. PSEG Long
        Island's public MySmartEnergy FAQ states verbatim: "Yes, you can
        download data information in CSV or Green Button (.XML) format. Just
        choose the time interval and date range."
        (https://www.psegliny.com/myaccount/serviceandrates/mysmartenergy, HTTP
        200 on 2026-07-27). This is a file export reachable only after logging
        in to a customer account, so it could NOT be verified anonymously. No
        Green Button Alliance certification listing for PSEG, PSE&G, or PSEG
        Long Island was found; greenbuttonalliance.org/certified and
        /certified-products both returned HTTP 404 and
        greenbuttondata.org/utilities.html (HTTP 200) names no PSEG entity.
      * VERIFIABLY ABSENT — Green Button Connect My Data. No OAuth authorization
        server, no ESPI /DataCustodian or /espi/1_1/resource base URI, and no
        third-party registration path was found on any PSEG host. In the New
        Jersey BPU AMI docket PSE&G's own position was that a third party
        seeking interval data for many residential accounts must have each
        customer manually log in and add that third party as a secondary user —
        i.e. no programmatic or bulk mechanism — with the alternatives being a
        signed Letter of Authorization answered with spreadsheet files by email,
        and EDI plus web portal for BPU-licensed third-party suppliers.
      * PSEG Long Island proposed supporting Green Button Connect My Data in its
        2018 Utility 2.0 Long Range Plan; no live CMD surface was found in 2026.
    A compliance page, a rate-case commitment, and a regulator's order are all
    recorded here as claims. None of them is an implementation.

  dataStandard: >-
    Green Button / NAESB REQ.21 ESPI, Download My Data profile only, as a
    CSV/XML file export from the MySmartEnergy (MyMeter) portal. No ESPI version
    is published. No Connect My Data. No OpenADR, IEEE 2030.5, OCPP/OCPI, or
    IEC CIM 61968/61970 reference found on any PSEG property. For third-party
    energy suppliers the interchange is legacy retail-choice EDI, not a modern
    API.

  consumerDataAPI:
    available: false
    note: >-
      A third party cannot obtain an individual PSEG customer's usage or billing
      data through any documented API. The routes that exist are (1) the
      customer downloads a CSV or Green Button XML file themselves, (2) the
      customer adds the third party as a view-only secondary user inside
      MySmartEnergy/MyMeter, (3) a signed Letter of Authorization returned as
      emailed spreadsheets, (4) EDI for BPU-licensed suppliers. All four are
      human-mediated. None is an API.
    portals:
      - url: https://mysmartenergy.nj.pseg.com/
        status: 200
        note: >-
          MyMeter for PSE&G New Jersey. Operated by Accelerated Innovations, LLC
          (branded MyMeter, v10.5.1.5). Anonymous landing page mentions no Green
          Button, no download, no API.
      - url: https://mysmartenergy.psegliny.com/
        status: 200
        note: MySmartEnergy for PSEG Long Island, same MyMeter platform.
      - url: https://mysmartenergy.nj.pseg.com/WholeBuilding/RequestOwnerPermission
        status: 200
        note: >-
          Whole-building aggregated usage request. A web form requiring building
          owner permission, not an API.
      - url: https://nj.myaccount.pseg.com/
        status: 200
        note: Redirects to /user/login. Customer account login, not a developer portal.

  marketDataOpen:
    available: false
    note: >-
      PSEG publishes no open grid, market, or system data API. The two public
      real-time surfaces are outage maps, and both are vendor-hosted KUBRA
      StormCenter single-page applications loading from kubra.io with an
      instanceId/viewId pair — an embedded product, not a PSEG-published data
      API, with no documentation, no terms of use for data, and no stable
      contract. Open data for this footprint comes from PJM and the U.S. EIA.
    probes:
      - url: https://outagecenter.pseg.com/
        status: 200
        note: >-
          "PSE&G NJ Outage Map", KUBRA StormCenter 5.52.0, host https://kubra.io,
          instanceId 79d82478-c10a-4956-a045-89de3cda618c.
      - url: https://outagemap.psegliny.com/
        status: 200
        note: >-
          "PSEG Long Island My Power Map", KUBRA StormCenter 5.52.0,
          instanceId 48006d55-45bb-40a4-99a6-1289326f0d0d.
      - url: https://outagemap.pseg.com/
        status: 000
        note: Does not resolve.

  accessGate: customer-account-required
  accessGateNote: >-
    What a developer actually has to do to get in: nothing works. There is no
    signup, no key, no application form, no sandbox and no published contact for
    API access anywhere on pseg.com, nj.pseg.com, corporate.pseg.com, or
    psegliny.com. The only way to reach PSEG energy data is to BE a PSE&G or
    PSEG Long Island customer and log in at nj.myaccount.pseg.com, then export a
    CSV or Green Button XML file from MyMeter/MySmartEnergy, or to be added by
    that customer as a view-only secondary user. Acting for many customers means
    a Letter of Authorization and spreadsheets by email, or BPU third-party
    supplier licensure and EDI — a regulatory relationship, not developer
    onboarding.

  authModel: >-
    No developer authentication model exists because there is no developer
    surface. Customer access is username/password session login at
    nj.myaccount.pseg.com. No OAuth 2.0 authorization server, no API keys, no
    mTLS, no OpenID Connect discovery document was served:
    /.well-known/openid-configuration on www.pseg.com, nj.pseg.com,
    nj.myaccount.pseg.com and outagecenter.pseg.com returned the site's
    soft-404 or SPA fallback rather than JSON, and on
    mysmartenergy.nj.pseg.com returned a hard HTTP 404.

