name: PSEG
kind: company
description: >-
  Public Service Enterprise Group (PSEG) is a diversified energy holding company
  headquartered in Newark, New Jersey. Its regulated utility subsidiary Public
  Service Electric and Gas (PSE&G) is New Jersey's largest electric and gas
  distribution utility, and PSEG Long Island operates the transmission and
  distribution system on behalf of the Long Island Power Authority. PSEG sits
  squarely in the utility-retailer tier of the United States energy value chain
  — it meters, bills, and serves end customers, and it sells generation into
  the PJM wholesale market rather than publishing that market's data itself.
  Its API posture is honestly closed. There is no developer portal: developer.,
  developers., api., docs., and data.pseg.com do not resolve, and /developers,
  /api, and /docs on pseg.com return the site's soft-404 page. Green Button is
  present only as a file: PSEG Long Island's MySmartEnergy FAQ states customers
  can "download data information in CSV or Green Button (.XML) format," which is
  Download My Data behind a customer login, not Connect My Data. There is no
  documented programmatic third-party access to customer usage data — in the New
  Jersey BPU AMI docket PSE&G described manual secondary-user sharing, a Letter
  of Authorization with spreadsheets emailed back, and EDI for BPU-licensed
  suppliers. Grid data is equally closed: the PSE&G NJ and PSEG Long Island
  outage maps are vendor-hosted KUBRA StormCenter applications with no published
  data API. Open market data for this territory comes from PJM and the EIA, not
  from PSEG.
