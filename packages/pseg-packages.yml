summary: >-
  PSEG ships NO first-party client libraries in any language, and it has no published API for one to
  wrap. npm returns zero packages for "pseg". PyPI has exactly one, and it is community work. There
  is a GitHub organization — github.com/PSEGLI, "PSEG Long Island", contact
  DL-PSEGLI-GitHub-Support@pseg.com, created 2018-06-11 — but it has ZERO public repositories, so it
  hosts no SDK, no spec and no sample code. api.github.com/orgs/pseg is a 404 (no PSE&G / parent-company
  org). What exists on the registries is reverse-engineered customer-portal automation written by
  individuals, recorded here as such: both packages log in AS the customer with pseg.com credentials
  rather than calling any documented API, which is the practical consequence of the closed posture
  described in review.yml.
